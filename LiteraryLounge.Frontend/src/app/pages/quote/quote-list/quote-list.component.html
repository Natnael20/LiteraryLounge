<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fa fa-quote-left"></i> Quotes</h2>
        <button class="btn custom-button d-flex gap-2 align-items-center" (click)="goToAddQuote()">
            <i class="fa fa-plus"></i> Add Quote
        </button>
    </div>

    <!-- Quote Details View -->
    <div *ngIf="showQuoteDetails && selectedQuote" class="card mb-3 border-0">
        <div class="card-header bg-transparent">
            <h3 class="text-secondary">Quote Details</h3>
        </div>
        <div class="card-body">
            <p><strong>Quote:</strong> "{{ selectedQuote.text }}"</p>
            <p><strong>Author:</strong> {{ selectedQuote.author }}</p>
            <p><strong>Source:</strong> {{ selectedQuote.source || 'Unknown' }}</p>
            <button class="btn custom-button d-flex gap-2 align-items-center" (click)="hideDetails()">
                <i class="fa fa-arrow-left"></i> 
                <span>Back</span>
            </button>
        </div>
    </div>

    <!-- Quotes Grid -->
    <div class="row" *ngIf="!showQuoteDetails">
        <div class="col-md-6 mb-3" *ngFor="let quote of quotes">
            <div class="card h-100">
                <div class="card-body">
                    <blockquote class="blockquote mb-0">
                        <p>"{{ quote.text }}"</p>
                        <footer class="blockquote-footer">
                            {{ quote.author }}
                            <cite *ngIf="quote.source"> - {{ quote.source }}</cite>
                        </footer>
                    </blockquote>
                    <div class="btn-group w-100 d-flex gap-3 mt-5" role="group">
                        <button title="view" class="btn btn-sm btn-info d-flex justify-content-center align-items-center align-items-center gap-2" (click)="viewQuoteDetails(quote.id!)">
                            <i class="fa fa-eye"></i>
                            <span>View</span>
                        </button>
                        <button title="edit" class="btn btn-sm btn-warning d-flex justify-content-center align-items-center gap-2 me-1" (click)="editQuote(quote.id!)">
                            <i class="fa fa-edit"></i>
                            <span>Edit</span>
                        </button>
                        <button title="delete" class="btn btn-sm btn-danger d-flex justify-content-center align-items-center gap-2" (click)="deleteQuote(quote.id!)">
                            <i class="fa fa-trash"></i>
                            <span>Delete</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div *ngIf="quotes.length === 0" class="col-12">
            <div class="alert alert-info text-center">
                No quotes yet. Click "Add Quote" to get started!
            </div>
        </div>
    </div>
</div>
