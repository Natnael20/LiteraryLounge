<div class="container mt-4">
    <div class="card border-0 p-3 mx-auto" style="max-width: 500px;">
        <div class="card-header bg-transparent">
            <h3 class="text-secondary">Edit Quote</h3>
        </div>
        <div class="card-body">
            <div class="alert alert-success rounded-2 p-3" *ngIf="successMessage">
                {{ successMessage }}
            </div>
            <div class="alert alert-danger rounded-2 p-3" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <form (ngSubmit)="updateQuote()">
                <div class="mb-3">
                    <label class="form-label text-secondary">Quote Text</label>
                    <textarea class="form-control border-0 border-bottom border-2" [(ngModel)]="quote.text" name="text" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">Author</label>
                    <input type="text" class="form-control border-0 border-bottom border-2" [(ngModel)]="quote.author" name="author" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">Source (Optional)</label>
                    <input type="text" class="form-control border-0 border-bottom border-2" [(ngModel)]="quote.source" name="source">
                </div>

                <div class="d-flex mt-5 justify-content-between">
                    <button type="button" class="btn custom-button d-flex gap-2 align-items-center" (click)="cancel()">
                        <i class="fa fa-times"></i>
                        <span>Cancel</span>
                    </button>
                    <button type="submit" class="btn custom-button">Update Quote</button>
                </div>
            </form>
        </div>
    </div>
</div>
