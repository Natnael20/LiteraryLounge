[build]
  base = "LiteraryLounge.Frontend"
  publish = "dist/literary-lounge-frontend"
  command = "npm install && ng build --configuration=production"

[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200