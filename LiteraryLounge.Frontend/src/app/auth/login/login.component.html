<div class="container mt-5">
    <div class="row d-flex align-items-center">
        <!-- Left Side - Image with dynamic overlay -->
        <div class="col-12 col-md-6">
            <div class="register-wrapper position-relative">
                <div class="register-img position-relative overflow-hidden">
                    <img src="https://plus.unsplash.com/premium_photo-1669652639337-c513cc42ead6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Ym9va3N8ZW58MHx8MHx8fDA%3D" alt="background" class="img-fluid">
                </div>
                <div class="register-content text-light text-center position-absolute top-50 start-50 translate-middle z-3">
                    <h3 class="mb-3 ">Welcome Back!</h3>
                    <p class="mb-4 opacity-75">Log in to access your personalized literary sanctuary, where you can manage your book collection, share your favorite quotes, and connect with fellow book lovers. Your next great read is just a login away!</p>
                    <button class="btn custom-button" routerLink="/register">Register Now!</button>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="col-12 col-md-6">
            <div class="card shadow border-0">
                <div class="card-header p-3 bg-transparent">
                    <h3 class="ms-2 opacity-75">Login</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger rounded-2 p-3" *ngIf="errorMessage">
                        {{ errorMessage }}
                    </div>

                    <form (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label class="form-label opacity-75">Username</label>
                            <input type="text" class="form-control border-0 border-bottom border-2" [(ngModel)]="username" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label opacity-75">Password</label>
                            <input type="password" class="form-control border-0 border-bottom border-2" [(ngModel)]="password" name="password" required>
                        </div>


                        <div class="submit-button mt-5 text-center">
                            <button type="submit" class="btn text-center custom-button w-50">
                              {{ loading ? 'Logging in...' : 'Login' }}
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a class="text-decoration-none underline" routerLink="/register">
                            Don't have an account? Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--footer container is reused here-->
    <app-footer></app-footer>
</div>
