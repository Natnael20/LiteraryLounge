[build]
  base = "LiteraryLounge.Frontend"
  publish = "dist/LiteraryLounge.Frontend/browser"
  command = "npm install && ng build --configuration=production"

[[redirects]]
  from = "/api/*"
  to = "https://literarylounge-f5p5.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200